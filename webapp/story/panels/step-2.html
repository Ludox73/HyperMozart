<!-- ==================== STEP 2: Running a Geodesic ==================== -->
<div class="step locked" id="step-2">
  <div class="step-header" onclick="toggleStep(2)">
    <div class="step-number">2</div>
    <div class="step-title">Running a Geodesic</div>
    <div class="step-toggle">▼</div>
    <span class="lock-badge" id="lock-2">Build surface first</span>
  </div>
  <div class="step-body">
    <div class="step-content" id="content-2"></div>
    <div class="step-controls">
      <div class="controls-row">
        <div class="controls-group">
          <div class="group-title">Geodesic Parameters</div>
          <label>Max length <span class="val" id="v-maxlen">100.0k</span></label>
          <input type="range" id="maxlen" min="0" max="100" step="1" value="50">
          <label>Drawing speed <span class="val" id="v-speed">2.0</span></label>
          <input type="range" id="speed" min="1" max="100" step="0.5" value="2">
          <div class="checkbox-row">
            <input type="checkbox" id="fast-mode" checked><label for="fast-mode">Fast mode (no visualization)</label>
          </div>
        </div>
        <div class="controls-group">
          <div class="group-title">Active Curves</div>
          <div class="checkbox-row"><input type="checkbox" id="curve1-active" checked><label for="curve1-active">Curve 1</label></div>
          <div class="checkbox-row"><input type="checkbox" id="curve2-active" checked><label for="curve2-active">Curve 2</label></div>
          <div class="checkbox-row"><input type="checkbox" id="curve3-active" checked><label for="curve3-active">Curve 3</label></div>
        </div>
        <div class="controls-group" style="min-width:120px">
          <div class="group-title">Arc Save Filters</div>
          <label>Max count <input type="number" id="arc-save-max" value="5000" min="1" max="10000000" style="width:70px"></label>
          <label>Length <input type="number" id="arc-save-lmin" value="0" step="0.1" style="width:50px"> – <input type="number" id="arc-save-lmax" value="999999" step="0.1" style="width:55px"></label>
          <label>Init ∠ <input type="number" id="arc-save-iamin" value="1.54" step="0.01" style="width:50px"> – <input type="number" id="arc-save-iamax" value="1.60" step="0.01" style="width:50px"></label>
          <label>Final ∠ <input type="number" id="arc-save-famin" value="1.54" step="0.01" style="width:50px"> – <input type="number" id="arc-save-famax" value="1.60" step="0.01" style="width:50px"></label>
          <button onclick="setArcFilterPerp()" style="width:auto;padding:2px 8px;font-size:.7rem;margin-top:4px">Almost perpendicular</button>
        </div>
      </div>
      <div class="controls-actions">
        <button id="btn-run" onclick="startComputation()">Run Geodesic</button>
        <button id="btn-stop" class="stop" onclick="stopComputation()" disabled>Stop</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="status" id="status">Ready</div>
      <div class="audio-info" id="stats"></div>
    </div>
  </div>
</div>
