<!-- ==================== STEP 6: Arcs ==================== -->
<div class="step locked" id="step-6">
  <div class="step-header" onclick="toggleStep(6)">
    <div class="step-number">6</div>
    <div class="step-title">Arcs and Homotopy Classes</div>
    <div class="step-toggle">▼</div>
    <span class="lock-badge" id="lock-6">Run geodesic first</span>
  </div>
  <div class="step-body">
    <div class="step-content" id="content-6"></div>
    <div class="step-controls">
      <!-- Homotopy orthospectrum -->
      <div class="group-title">Orthospectrum from Arcs</div>
      <div class="controls-actions">
        <button id="btn-homotopy" onclick="computeHomotopyOrthospectrum()" disabled>Compute Orthospectrum</button>
        <button onclick="resetHomotopy()">Reset</button>
      </div>
      <div class="status" id="homotopy-status">Run geodesic first.</div>
      <div class="inline-panel" style="margin-bottom:16px">
        <table class="orth-table" id="homotopy-table">
          <thead><tr><th>#</th><th>Length</th><th>Count</th><th>Sequence</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Saved arcs -->
      <div class="group-title">Saved Arcs</div>
      <div class="controls-row" style="font-size:.8rem">
        <div class="controls-group" style="min-width:140px">
          <label>Length <input type="number" id="arc-draw-lmin" value="0" step="0.1" style="width:55px"> – <input type="number" id="arc-draw-lmax" value="999999" step="0.1" style="width:55px"></label>
        </div>
        <div class="controls-group" style="min-width:140px">
          <label>Init ∠ <input type="number" id="arc-draw-iamin" value="1.54" step="0.01" style="width:55px"> – <input type="number" id="arc-draw-iamax" value="1.60" step="0.01" style="width:55px"></label>
        </div>
        <div class="controls-group" style="min-width:140px">
          <label>Final ∠ <input type="number" id="arc-draw-famin" value="1.54" step="0.01" style="width:55px"> – <input type="number" id="arc-draw-famax" value="1.60" step="0.01" style="width:55px"></label>
        </div>
      </div>
      <div class="controls-actions">
        <button onclick="filterArcsTable()">Filter</button>
        <button onclick="resetArcsFilter()">Show All</button>
        <button onclick="drawFilteredArcsOnMain()">Draw on Main</button>
        <div class="checkbox-row"><input type="checkbox" id="arcs-one-per-class" onchange="updateArcsPanel()"><label for="arcs-one-per-class">One per class</label></div>
      </div>
      <div class="status" id="arcs-status" style="margin-top:4px"></div>
      <div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px;max-height:300px;overflow-y:auto">
          <table class="orth-table" id="arcs-table">
            <thead><tr>
              <th style="cursor:pointer" onclick="sortArcsTable('idx')">#</th>
              <th style="cursor:pointer" onclick="sortArcsTable('length')">Length ↕</th>
              <th style="cursor:pointer" onclick="sortArcsTable('initAngle')">Init ∠ ↕</th>
              <th style="cursor:pointer" onclick="sortArcsTable('finalAngle')">Final ∠ ↕</th>
              <th style="cursor:pointer" onclick="sortArcsTable('polyIdx')">Hex ↕</th>
              <th style="cursor:pointer" onclick="sortArcsTable('classIdx')">Class ↕</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div style="flex:0 0 auto">
          <div class="arc-mini-grid">
            <canvas id="arc-c0" width="170" height="170"></canvas>
            <canvas id="arc-c1" width="170" height="170"></canvas>
            <canvas id="arc-c2" width="170" height="170"></canvas>
            <canvas id="arc-c3" width="170" height="170"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
