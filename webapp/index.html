<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperMozart – Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin:18px 0 4px;font-size:1.5rem;color:#e8d5b7}
.subtitle{font-size:.85rem;color:#888;margin-bottom:14px}
.container{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:0 12px 24px;max-width:1200px;width:100%}
.panel{background:#16213e;border-radius:10px;padding:16px;border:1px solid #0f3460}
.params-panel{width:280px;min-width:250px}
.viz-panel{flex:1;min-width:500px;max-width:720px}
.controls-panel{width:240px;min-width:220px}
label{display:block;font-size:.8rem;color:#a0a0c0;margin:6px 0 2px}
input[type=range]{width:100%;accent-color:#e8d5b7}
.val{font-size:.75rem;color:#e8d5b7;float:right}
.group{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #0f3460}
.group-title{font-size:.9rem;font-weight:600;color:#c9a96e;margin-bottom:6px}
button{background:#0f3460;color:#e0e0e0;border:1px solid #e8d5b7;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.85rem;width:100%;margin:4px 0;transition:background .2s}
button:hover{background:#1a4a8a}
button:disabled{opacity:.4;cursor:not-allowed}
button.stop{background:#6a1010;border-color:#ff6666}
button.stop:hover{background:#8a2020}
button.play{background:#1a4a1a;border-color:#66ff66}
.progress-bar{width:100%;height:6px;background:#0a0a1a;border-radius:3px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:#e8d5b7;width:0%;transition:width .1s}
.status{font-size:.75rem;color:#888;text-align:center;min-height:1.2em}
canvas{border-radius:8px;background:#0a0a1a;display:block;margin:0 auto}
.hex-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hex-grid canvas{width:100%;height:auto}
.audio-info{font-size:.75rem;color:#888;text-align:center;margin-top:6px}
</style>
</head>
<body>
<h1>HyperMozart</h1>
<p class="subtitle">Geodesics on genus-2 hyperbolic surfaces — Separating S2 decomposition</p>
<div class="container">

<!-- Parameters Panel -->
<div class="panel params-panel">
<div class="group">
<div class="group-title">Curve Lengths</div>
<label>L1 <span class="val" id="v-l1">2.00</span></label>
<input type="range" id="l1" min="1" max="7" step="0.01" value="2.00">
<label>L2 <span class="val" id="v-l2">3.00</span></label>
<input type="range" id="l2" min="1" max="7" step="0.01" value="3.00">
<label>L3 <span class="val" id="v-l3">4.00</span></label>
<input type="range" id="l3" min="1" max="7" step="0.01" value="4.00">
</div>
<div class="group">
<div class="group-title">Twist Parameters</div>
<label>T1 <span class="val" id="v-t1">0.00</span></label>
<input type="range" id="t1" min="0" max="6.2832" step="0.01" value="0">
<label>T2 <span class="val" id="v-t2">0.00</span></label>
<input type="range" id="t2" min="0" max="6.2832" step="0.01" value="0">
<label>T3 <span class="val" id="v-t3">0.00</span></label>
<input type="range" id="t3" min="0" max="6.2832" step="0.01" value="0">
</div>
<div class="group">
<div class="group-title">Geodesic</div>
<label>Max length <span class="val" id="v-maxlen">10000</span></label>
<input type="range" id="maxlen" min="1000" max="100000" step="1000" value="10000">
<label>Drawing speed <span class="val" id="v-speed">2</span></label>
<input type="range" id="speed" min="1" max="10" step="0.5" value="2">
</div>
<button id="btn-run" onclick="startComputation()">Run Geodesic</button>
<button id="btn-stop" class="stop" onclick="stopComputation()" disabled>Stop</button>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="status" id="status">Ready</div>
</div>

<!-- Visualization Panel -->
<div class="panel viz-panel">
<div class="hex-grid">
<canvas id="c0" width="340" height="340"></canvas>
<canvas id="c1" width="340" height="340"></canvas>
<canvas id="c2" width="340" height="340"></canvas>
<canvas id="c3" width="340" height="340"></canvas>
</div>
</div>

<!-- Audio Panel -->
<div class="panel controls-panel">
<div class="group">
<div class="group-title">Audio</div>
<label>Speed multiplier <span class="val" id="v-audiospeed">1.0</span></label>
<input type="range" id="audiospeed" min="0.1" max="10" step="0.1" value="1.0">
<label>Max duration (s) <span class="val" id="v-maxdur">60</span></label>
<input type="range" id="maxdur" min="5" max="300" step="5" value="60">
<button id="btn-play" class="play" onclick="playAudio()" disabled>Play</button>
<button id="btn-stop-audio" class="stop" onclick="stopAudio()" disabled>Stop Audio</button>
<div class="audio-info" id="audio-info"></div>
</div>
<div class="group">
<div class="group-title">Statistics</div>
<div class="audio-info" id="stats"></div>
</div>
</div>
</div>

<script>
"use strict";

// ===== Complex number helpers =====
function cadd(a,b){return[a[0]+b[0],a[1]+b[1]]}
function csub(a,b){return[a[0]-b[0],a[1]-b[1]]}
function cmul(a,b){return[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]]}
function cdiv(a,b){const d=b[0]*b[0]+b[1]*b[1];return[(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]}
function cconj(a){return[a[0],-a[1]]}
function cabs(a){return Math.sqrt(a[0]*a[0]+a[1]*a[1])}
function cscale(s,a){return[s*a[0],s*a[1]]}

// 2x2 complex matrix operations
function matMul(A,B){
  return[[cmul(A[0][0],B[0][0]).map((v,i)=>v+cmul(A[0][1],B[1][0])[i]),
          cmul(A[0][0],B[0][1]).map((v,i)=>v+cmul(A[0][1],B[1][1])[i])],
         [cmul(A[1][0],B[0][0]).map((v,i)=>v+cmul(A[1][1],B[1][0])[i]),
          cmul(A[1][0],B[0][1]).map((v,i)=>v+cmul(A[1][1],B[1][1])[i])]]}
function matApply(M,z){return cdiv(cadd(cmul(M[0][0],z),M[0][1]),cadd(cmul(M[1][0],z),M[1][1]))}
function matDet(M){return csub(cmul(M[0][0],M[1][1]),cmul(M[0][1],M[1][0]))}
function matInv(M){const d=matDet(M);return[[cdiv(M[1][1],d),cdiv(cscale(-1,M[0][1]),d)],[cdiv(cscale(-1,M[1][0]),d),cdiv(M[0][0],d)]]}

// ===== Hyperbolic geometry =====
function distanceTwoPoints(p1,p2){
  const dx=p1[0]-p2[0],dy=p1[1]-p2[1];
  const n1=p1[0]*p1[0]+p1[1]*p1[1],n2=p2[0]*p2[0]+p2[1]*p2[1];
  const delta=2*(dx*dx+dy*dy)/((1-n1)*(1-n2));
  return Math.acosh(1+delta);
}

function angleCW2D(v1,v2,goingClockwise=true){
  const dp=v1[0]*v2[0]+v1[1]*v2[1];
  const det2=v1[0]*v2[1]-v1[1]*v2[0];
  if(goingClockwise)return 2*Math.PI-((Math.atan2(det2,dp)%(2*Math.PI)+2*Math.PI)%(2*Math.PI));
  return((Math.atan2(det2,dp)%(2*Math.PI)+2*Math.PI)%(2*Math.PI));
}

function geodesicCircumferenceFromSegment(sp,ep){
  const mx=(sp[0]+ep[0])/2,my=(sp[1]+ep[1])/2;
  const dx=ep[0]-sp[0],dy=ep[1]-sp[1];
  const segLen=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/segLen,uy=dy/segLen;
  const px=-uy,py=ux;
  const nm2=mx*mx+my*my;
  const num=segLen*segLen/4-nm2+1;
  const denom=2*(mx*px+my*py);
  const ned=num/denom;
  const cx=mx+px*ned,cy=my+py*ned;
  const cn2=(mx+px*ned)**2+(my+py*ned)**2;
  const r=Math.sqrt(cn2-1);
  return{center:[cx,cy],radius:r};
}

function geodesicCircumferenceFromPtv(point,tgVec){
  const norm2=Math.sqrt(tgVec[0]*tgVec[0]+tgVec[1]*tgVec[1]);
  const ux=tgVec[0]/norm2,uy=tgVec[1]/norm2;
  const px=-uy,py=ux;
  const mx=point[0],my=point[1];
  const nm2=mx*mx+my*my;
  const num=-nm2+1;
  const denom=2*(mx*px+my*py);
  const ned=num/denom;
  const cx=mx+px*ned,cy=my+py*ned;
  const cn2=(mx+px*ned)**2+(my+py*ned)**2;
  const r=Math.sqrt(Math.max(0,cn2-1));
  return{center:[cx,cy],radius:r};
}

function findIntersectionCircles(c1,r1,c2,r2){
  const dx=c2[0]-c1[0],dy=c2[1]-c1[1];
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d>r1+r2+1e-12||d<Math.abs(r1-r2)-1e-12)return null;
  const a=(r1*r1-r2*r2+d*d)/(2*d);
  const h2=r1*r1-a*a;
  const h=Math.sqrt(Math.max(0,h2));
  const mx=c1[0]+a/d*dx,my=c1[1]+a/d*dy;
  const hx=h/d*(c2[1]-c1[1]),hy=h/d*(c1[0]-c2[0]);
  return[[mx+hx,my+hy],[mx-hx,my-hy]];
}

// ===== Hexagon construction =====
function applyUpperHalfMatrix(M,z){
  // M is 2x2 real matrix, z is complex [re,im]
  return cdiv(cadd(cscale(M[0][0],z),[M[0][1],0]),cadd(cscale(M[1][0],z),[M[1][1],0]));
}

function rectangularHexagonCentered(l1,l3,l5){
  const cl1=Math.cosh(l1),sl1=Math.sinh(l1),cl3=Math.cosh(l3),sl3=Math.sinh(l3);
  const cl5=Math.cosh(l5),sl5=Math.sinh(l5);
  const l2=Math.acosh((cl1*cl3+cl5)/(sl1*sl3));
  const l4=Math.acosh((cl3*cl5+cl1)/(sl3*sl5));
  const l6=Math.acosh((cl5*cl1+cl3)/(sl5*sl1));
  const allSides=[l1,l2,l3,l4,l5,l6];

  // Build vertices in upper half plane
  const s22=Math.SQRT1_2;
  const Matrices=new Array(6);
  const V=new Array(6);
  V[0]=[0,1]; // i
  Matrices[0]=[[1,0],[0,1]];

  for(let k=1;k<6;k++){
    const eP=Math.exp(allSides[k-1]/2),eN=Math.exp(-allSides[k-1]/2);
    // M = rot45 * diag(eP,eN)
    const M_loc=[[s22*eP,s22*eN],[-s22*eP,s22*eN]];
    // Matrices[k] = inv(M_loc) * Matrices[k-1]
    const detM=s22*eP*s22*eN-s22*eN*(-s22*eP);
    const invM=[[s22*eN/detM,-s22*eN/detM],[s22*eP/detM,s22*eP/detM]];
    Matrices[k]=mat2mul(invM,Matrices[k-1]);
    // V[k] = apply(inv(Matrices[k-1])*M_loc, i)
    const invPrev=mat2inv(Matrices[k-1]);
    const combo=mat2mul(invPrev,M_loc);
    V[k]=applyUpperHalfMatrix(combo,[0,1]);
  }

  // Apply correction matrix and convert to Poincare
  const corrM=[[1.25,0.5],[0,1/1.25]];
  const poincareVerts=[];
  const complexPoincare=[];
  for(let k=0;k<6;k++){
    const aus=applyUpperHalfMatrix(corrM,V[k]);
    // (aus - i)/(aus + i)
    const p=cdiv(csub(aus,[0,1]),cadd(aus,[0,1]));
    poincareVerts.push([p[0],p[1]]);
    complexPoincare.push(p);
  }

  // Compute barycenter (Euclidean mean as approximation for visualization)
  let bx=0,by=0;
  for(let k=0;k<6;k++){bx+=poincareVerts[k][0];by+=poincareVerts[k][1];}
  bx/=6;by/=6;
  const bary=[bx,by];

  // Move barycenter to origin via Mobius
  const result=[];
  for(let k=0;k<6;k++){
    const z=complexPoincare[k];
    const bc=[bary[0],bary[1]];
    // (z - bc) / (1 - conj(bc)*z)
    const num=csub(z,bc);
    const den=csub([1,0],cmul(cconj(bc),z));
    const w=cdiv(num,den);
    result.push([w[0],w[1]]);
  }
  return{vertices:result,allSides:allSides};
}

// 2x2 real matrix helpers
function mat2mul(A,B){return[[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]];}
function mat2inv(M){const d=M[0][0]*M[1][1]-M[0][1]*M[1][0];return[[M[1][1]/d,-M[0][1]/d],[-M[1][0]/d,M[0][0]/d]];}

// ===== Isometry computation =====
function isometryH2TwoPointsUpperHalf(p1,p2,q1,q2){
  // Build 4x4 real linear system A*[a,b,c,d]=0
  const P=[p1,p2],Q=[q1,q2];
  const A=[];
  for(let j=0;j<2;j++){
    const pj=P[j],qj=Q[j];
    const qp=cmul(qj,pj);
    A.push([pj[0],1,-qp[0],-qj[0]]);
    A.push([pj[1],0,-qp[1],-qj[1]]);
  }
  // Find null space of 4x4 matrix (1D)
  const v=nullSpace4x4(A);
  let a=v[0],b=v[1],c=v[2],d=v[3];
  let det=a*d-b*c;
  if(det<0){a=-a;b=-b;c=-c;d=-d;det=-det;}
  const s=1/Math.sqrt(det);
  return[[a*s,b*s],[c*s,d*s]];
}

function nullSpace4x4(A){
  // Gaussian elimination with pivoting to find null space of 4x4 matrix
  const M=A.map(r=>[...r]);
  const n=4;
  const pivotCols=[];
  let row=0;
  for(let col=0;col<n&&row<4;col++){
    let maxVal=0,maxRow=row;
    for(let r=row;r<4;r++){if(Math.abs(M[r][col])>maxVal){maxVal=Math.abs(M[r][col]);maxRow=r;}}
    if(maxVal<1e-14)continue;
    [M[row],M[maxRow]]=[M[maxRow],M[row]];
    const piv=M[row][col];
    for(let c=0;c<n;c++)M[row][c]/=piv;
    for(let r=0;r<4;r++){
      if(r===row)continue;
      const f=M[r][col];
      for(let c=0;c<n;c++)M[r][c]-=f*M[row][c];
    }
    pivotCols.push(col);
    row++;
  }
  // Find free column
  const free=[];
  for(let c=0;c<n;c++)if(!pivotCols.includes(c))free.push(c);
  if(free.length===0)return[0,0,0,1]; // fallback
  const fc=free[0];
  const result=[0,0,0,0];
  result[fc]=1;
  for(let i=0;i<pivotCols.length;i++){
    result[pivotCols[i]]=-M[i][fc];
  }
  return result;
}

function poincareToCplx(p){return[p[0],p[1]];}
function poincareToUpperHalf(z){
  // z_uh = i*(1+z)/(1-z)
  return cdiv(cmul([0,1],cadd([1,0],z)),csub([1,0],z));
}

function isometryH2TwoPointsPoincare(p1,p2,q1,q2){
  const z1=poincareToUpperHalf(poincareToCplx(p1));
  const z2=poincareToUpperHalf(poincareToCplx(p2));
  const w1=poincareToUpperHalf(poincareToCplx(q1));
  const w2=poincareToUpperHalf(poincareToCplx(q2));
  const LM=isometryH2TwoPointsUpperHalf(z1,z2,w1,w2);
  // poinc_M = [1,-i;1,i]*LM*[i,i;-1,1]
  const T1=[[[1,0],[0,-1]],[[1,0],[0,1]]];
  const T2=[[[0,1],[0,1]],[[-1,0],[1,0]]];
  const LMc=LM.map(r=>r.map(v=>[v,0]));
  const poincM=matMul(matMul(T1,LMc),T2);
  return{poincare:poincM,upperHalf:LMc};
}

function isometryH2TwoPointsWithTranslationPoincare(p1,p2,q1,q2,translationAmount){
  const z1=poincareToUpperHalf(poincareToCplx(p1));
  const z2=poincareToUpperHalf(poincareToCplx(p2));
  const w1=poincareToUpperHalf(poincareToCplx(q1));
  const w2=poincareToUpperHalf(poincareToCplx(q2));
  const L1M=isometryH2TwoPointsUpperHalf(z1,z2,w1,w2);
  const lenSide=distanceTwoPoints(p1,p2);
  const TM=isometryH2TwoPointsUpperHalf(z1,z2,[0,1],[0,Math.exp(lenSide)]);
  const transM=[[Math.exp(translationAmount/2),0],[0,Math.exp(-translationAmount/2)]];
  // LM = L1M * inv(TM) * transM * TM
  const TMd=TM[0][0]*TM[1][1]-TM[0][1]*TM[1][0];
  const TMi=[[TM[1][1]/TMd,-TM[0][1]/TMd],[-TM[1][0]/TMd,TM[0][0]/TMd]];
  const step1=mat2mul(TMi,transM);
  const step2=mat2mul(step1,TM);
  const LM=mat2mul(L1M,step2);

  const T1=[[[1,0],[0,-1]],[[1,0],[0,1]]];
  const T2=[[[0,1],[0,1]],[[-1,0],[1,0]]];
  const LMc=LM.map(r=>r.map(v=>[v,0]));
  const poincM=matMul(matMul(T1,LMc),T2);
  return{poincare:poincM,upperHalf:LMc};
}

function applyPoincarePointAndVector(M,point,tgVec){
  const z=[point[0],point[1]],v=[tgVec[0],tgVec[1]];
  const denom=cadd(cmul(M[1][0],z),M[1][1]);
  const newZ=cdiv(cadd(cmul(M[0][0],z),M[0][1]),denom);
  const det=csub(cmul(M[0][0],M[1][1]),cmul(M[0][1],M[1][0]));
  const newV=cmul(cdiv(det,cmul(denom,denom)),v);
  return{point:[newZ[0],newZ[1]],tgVec:[newV[0],newV[1]]};
}

function applyUpperHalfPointAndVectorOrientationReversing(M,point,tgVec){
  const z=[point[0],point[1]],v=[tgVec[0],tgVec[1]];
  const zc=cconj(z);
  const denom=cadd(cmul(M[1][0],zc),M[1][1]);
  const newZ=cdiv(cadd(cmul(M[0][0],zc),M[0][1]),denom);
  const det=csub(cmul(M[0][0],M[1][1]),cmul(M[0][1],M[1][0]));
  const newV=cmul(cdiv(det,cmul(denom,denom)),cconj(v));
  return{point:[newZ[0],newZ[1]],tgVec:[newV[0],newV[1]]};
}

// ===== Gluing structure =====
function createGluingSeparatingS2(){
  const g={};
  g.hexCurveIndices=[[0,1,1],[0,1,1],[0,2,2],[0,2,2]]; // 0-indexed curve indices
  g.noncoherentPairs=[[0,1],[0,3],[1,0],[1,2],[2,1],[2,3],[3,0],[3,2]];
  g.curveCombinations=[
    [[0,0],[1,0],[2,0],[3,0]],      // curve 1
    [[0,2],[0,4],[1,2],[1,4]],      // curve 2
    [[2,2],[2,4],[3,2],[3,4]]       // curve 3
  ];

  // Build pairings (0-indexed hex and side)
  g.pairings=new Array(4);
  for(let i=0;i<4;i++)g.pairings[i]=new Array(6);

  // Simple pairings (sides 1,3,5 in 0-indexed)
  g.pairings[0][1]={type:'simple',tgtHex:1,tgtSide:1,srcVtx:[1,2],tgtVtx:[1,2]};
  g.pairings[0][3]={type:'simple',tgtHex:1,tgtSide:3,srcVtx:[3,4],tgtVtx:[3,4]};
  g.pairings[0][5]={type:'simple',tgtHex:1,tgtSide:5,srcVtx:[5,0],tgtVtx:[5,0]};
  g.pairings[1][1]={type:'simple',tgtHex:0,tgtSide:1,srcVtx:[1,2],tgtVtx:[1,2]};
  g.pairings[1][3]={type:'simple',tgtHex:0,tgtSide:3,srcVtx:[3,4],tgtVtx:[3,4]};
  g.pairings[1][5]={type:'simple',tgtHex:0,tgtSide:5,srcVtx:[5,0],tgtVtx:[5,0]};
  g.pairings[2][1]={type:'simple',tgtHex:3,tgtSide:1,srcVtx:[1,2],tgtVtx:[1,2]};
  g.pairings[2][3]={type:'simple',tgtHex:3,tgtSide:3,srcVtx:[3,4],tgtVtx:[3,4]};
  g.pairings[2][5]={type:'simple',tgtHex:3,tgtSide:5,srcVtx:[5,0],tgtVtx:[5,0]};
  g.pairings[3][1]={type:'simple',tgtHex:2,tgtSide:1,srcVtx:[1,2],tgtVtx:[1,2]};
  g.pairings[3][3]={type:'simple',tgtHex:2,tgtSide:3,srcVtx:[3,4],tgtVtx:[3,4]};
  g.pairings[3][5]={type:'simple',tgtHex:2,tgtSide:5,srcVtx:[5,0],tgtVtx:[5,0]};

  // Twisted pairings (sides 0,2,4 in 0-indexed)
  g.pairings[0][0]={type:'twisted',primaryTgtHex:2,primaryTgtSide:0,secondaryTgtHex:3,secondaryTgtSide:0,
    srcVtx:[0,1],primaryVtx:[1,0],secondaryVtx:[0,1],twistParamIndex:0,twistSign:1};
  g.pairings[0][2]={type:'twisted',primaryTgtHex:0,primaryTgtSide:4,secondaryTgtHex:1,secondaryTgtSide:4,
    srcVtx:[2,3],primaryVtx:[5,4],secondaryVtx:[4,5],twistParamIndex:1,twistSign:1};
  g.pairings[0][4]={type:'twisted',primaryTgtHex:0,primaryTgtSide:2,secondaryTgtHex:1,secondaryTgtSide:2,
    srcVtx:[4,5],primaryVtx:[3,2],secondaryVtx:[2,3],twistParamIndex:1,twistSign:-1};

  g.pairings[1][0]={type:'twisted',primaryTgtHex:3,primaryTgtSide:0,secondaryTgtHex:2,secondaryTgtSide:0,
    srcVtx:[0,1],primaryVtx:[1,0],secondaryVtx:[0,1],twistParamIndex:0,twistSign:-1};
  g.pairings[1][2]={type:'twisted',primaryTgtHex:1,primaryTgtSide:4,secondaryTgtHex:0,secondaryTgtSide:4,
    srcVtx:[2,3],primaryVtx:[5,4],secondaryVtx:[4,5],twistParamIndex:1,twistSign:-1};
  g.pairings[1][4]={type:'twisted',primaryTgtHex:1,primaryTgtSide:2,secondaryTgtHex:0,secondaryTgtSide:2,
    srcVtx:[4,5],primaryVtx:[3,2],secondaryVtx:[2,3],twistParamIndex:1,twistSign:1};

  g.pairings[2][0]={type:'twisted',primaryTgtHex:0,primaryTgtSide:0,secondaryTgtHex:1,secondaryTgtSide:0,
    srcVtx:[0,1],primaryVtx:[1,0],secondaryVtx:[0,1],twistParamIndex:0,twistSign:-1};
  g.pairings[2][2]={type:'twisted',primaryTgtHex:2,primaryTgtSide:4,secondaryTgtHex:3,secondaryTgtSide:4,
    srcVtx:[2,3],primaryVtx:[5,4],secondaryVtx:[4,5],twistParamIndex:2,twistSign:1};
  g.pairings[2][4]={type:'twisted',primaryTgtHex:2,primaryTgtSide:2,secondaryTgtHex:3,secondaryTgtSide:2,
    srcVtx:[4,5],primaryVtx:[3,2],secondaryVtx:[2,3],twistParamIndex:2,twistSign:-1};

  g.pairings[3][0]={type:'twisted',primaryTgtHex:1,primaryTgtSide:0,secondaryTgtHex:0,secondaryTgtSide:0,
    srcVtx:[0,1],primaryVtx:[1,0],secondaryVtx:[0,1],twistParamIndex:0,twistSign:1};
  g.pairings[3][2]={type:'twisted',primaryTgtHex:3,primaryTgtSide:4,secondaryTgtHex:2,secondaryTgtSide:4,
    srcVtx:[2,3],primaryVtx:[5,4],secondaryVtx:[4,5],twistParamIndex:2,twistSign:-1};
  g.pairings[3][4]={type:'twisted',primaryTgtHex:3,primaryTgtSide:2,secondaryTgtHex:2,secondaryTgtSide:2,
    srcVtx:[4,5],primaryVtx:[3,2],secondaryVtx:[2,3],twistParamIndex:2,twistSign:1};

  // Style lookup
  g.styleLookup=[
    [8,1,6,2,6,0],[8,1,6,2,6,0],
    [8,5,7,4,7,3],[8,5,7,4,7,3]
  ]; // 0-indexed style indices
  return g;
}

function buildPolytopes(gluing,lengths){
  const polytopes=[];
  for(let i=0;i<4;i++){
    const idx=gluing.hexCurveIndices[i];
    const h=rectangularHexagonCentered(lengths[idx[0]]/2,lengths[idx[1]]/2,lengths[idx[2]]/2);
    polytopes.push(h.vertices);
  }
  return polytopes;
}

function buildCircles(polytopes){
  const circles=[];
  for(let i=0;i<polytopes.length;i++){
    const coll=[];
    for(let s=0;s<6;s++){
      const s2=(s+1)%6;
      const gc=geodesicCircumferenceFromSegment(polytopes[i][s],polytopes[i][s2]);
      coll.push(gc);
    }
    circles.push(coll);
  }
  return circles;
}

// ===== Core geodesic step =====
function findLineCircleIntersections(p,d,cc,rc){
  // Intersect line p+t*d with circle (cc,rc). Returns array of [point, t] or null.
  const fx=p[0]-cc[0],fy=p[1]-cc[1];
  const a=d[0]*d[0]+d[1]*d[1];
  const b=2*(fx*d[0]+fy*d[1]);
  const c=fx*fx+fy*fy-rc*rc;
  let disc=b*b-4*a*c;
  if(disc<0)return null;
  disc=Math.sqrt(disc);
  const t1=(-b-disc)/(2*a),t2=(-b+disc)/(2*a);
  return[[p[0]+t1*d[0],p[1]+t1*d[1]],t1,[p[0]+t2*d[0],p[1]+t2*d[1]],t2];
}

function firstIntersection(point,tgVec,circles,toAvoid){
  const gc=geodesicCircumferenceFromPtv(point,tgVec);
  const c1=gc.center,r1=gc.radius;

  // Detect degenerate case: geodesic is nearly a straight line (point near origin)
  const isLine=!isFinite(r1)||r1>1e8;

  const intPoints=[];

  if(isLine){
    // Use line-circle intersection: geodesic ≈ straight line through point in direction tgVec
    const tn=Math.sqrt(tgVec[0]*tgVec[0]+tgVec[1]*tgVec[1]);
    const dir=[tgVec[0]/tn,tgVec[1]/tn];
    for(let s=0;s<circles.length;s++){
      if(s===toAvoid)continue;
      const res=findLineCircleIntersections(point,dir,circles[s].center,circles[s].radius);
      if(res){
        intPoints.push({pt:res[0],side:s,t:res[1]});
        intPoints.push({pt:res[2],side:s,t:res[3]});
      }
    }
    // Pick closest intersection in forward direction (t>0) inside disk
    let minT=Infinity,bestIdx=-1;
    for(let i=0;i<intPoints.length;i++){
      const ip=intPoints[i].pt;
      if(ip[0]*ip[0]+ip[1]*ip[1]>1+1e-8)continue;
      if(intPoints[i].t>1e-10&&intPoints[i].t<minT){minT=intPoints[i].t;bestIdx=i;}
    }
    if(bestIdx<0)return null;
    const arrPt=intPoints[bestIdx].pt;
    const arrSide=intPoints[bestIdx].side;
    // For a straight-line geodesic, tangent at arrival ≈ same direction, scaled to hyperbolic metric
    const np2=arrPt[0]*arrPt[0]+arrPt[1]*arrPt[1];
    const scale=(2*(1-np2))**2;
    const tv=[dir[0]*scale,dir[1]*scale];
    return{point:arrPt,tgVec:tv,side:arrSide};
  }

  for(let s=0;s<circles.length;s++){
    if(s===toAvoid)continue;
    const pts=findIntersectionCircles(c1,r1,circles[s].center,circles[s].radius);
    if(pts){
      intPoints.push({pt:pts[0],side:s});
      intPoints.push({pt:pts[1],side:s});
    }
  }

  const det=((point[0]-c1[0])*tgVec[1]-(point[1]-c1[1])*tgVec[0]);
  const goClockwise=det<=0;

  let minAng=Infinity,bestIdx=-1;
  for(let i=0;i<intPoints.length;i++){
    const ip=intPoints[i].pt;
    if(ip[0]*ip[0]+ip[1]*ip[1]>1+1e-8)continue;
    const ang=angleCW2D([point[0]-c1[0],point[1]-c1[1]],[ip[0]-c1[0],ip[1]-c1[1]],goClockwise);
    if(ang<minAng&&ang>1e-10){minAng=ang;bestIdx=i;}
  }

  if(bestIdx<0)return null;
  const arrPt=intPoints[bestIdx].pt;
  const arrSide=intPoints[bestIdx].side;

  // Compute tangent at arrival
  const ray=[arrPt[0]-c1[0],arrPt[1]-c1[1]];
  let tv;
  if(!goClockwise)tv=[-ray[1],ray[0]];
  else tv=[ray[1],-ray[0]];
  const tn=Math.sqrt(tv[0]*tv[0]+tv[1]*tv[1]);
  const np2=arrPt[0]*arrPt[0]+arrPt[1]*arrPt[1];
  const scale=(2*(1-np2))**2;
  tv=[tv[0]/tn*scale,tv[1]/tn*scale];

  return{point:arrPt,tgVec:tv,side:arrSide};
}

function isRow(row,matrix){
  for(const r of matrix)if(r[0]===row[0]&&r[1]===row[1])return true;
  return false;
}

function computeIsometryWithTwistedParameter(point,p1,p2,q1,q2,q3,q4,twistedParam){
  const lenSide=distanceTwoPoints(p1,p2);
  const translationAmount=2*lenSide*(twistedParam/(2*Math.PI));
  const dp1=distanceTwoPoints(point,p1);

  if(dp1+(translationAmount-2*lenSide)>0){
    return{iso:isometryH2TwoPointsWithTranslationPoincare(p1,p2,q1,q2,translationAmount-2*lenSide),overshoot:2};
  }else if(dp1+(translationAmount-lenSide)>0){
    return{iso:isometryH2TwoPointsWithTranslationPoincare(p1,p2,q3,q4,translationAmount-lenSide),overshoot:1};
  }else{
    return{iso:isometryH2TwoPointsWithTranslationPoincare(p1,p2,q1,q2,translationAmount),overshoot:0};
  }
}

function pairingFromGluing(gluing,inHex,inSide,twistedParams,intersectionPoint,polytopes){
  const p=gluing.pairings[inHex][inSide];
  if(p.type==='simple'){
    const iso=isometryH2TwoPointsPoincare(
      polytopes[inHex][p.srcVtx[0]],polytopes[inHex][p.srcVtx[1]],
      polytopes[p.tgtHex][p.tgtVtx[0]],polytopes[p.tgtHex][p.tgtVtx[1]]);
    return{outHex:p.tgtHex,outSide:p.tgtSide,iso:iso};
  }else{
    let t=twistedParams[p.twistParamIndex];
    if(p.twistSign===-1)t=2*Math.PI-t;
    const r=computeIsometryWithTwistedParameter(intersectionPoint,
      polytopes[inHex][p.srcVtx[0]],polytopes[inHex][p.srcVtx[1]],
      polytopes[p.primaryTgtHex][p.primaryVtx[0]],polytopes[p.primaryTgtHex][p.primaryVtx[1]],
      polytopes[p.secondaryTgtHex][p.secondaryVtx[0]],polytopes[p.secondaryTgtHex][p.secondaryVtx[1]],
      t);
    if(r.overshoot===0||r.overshoot===2)
      return{outHex:p.primaryTgtHex,outSide:p.primaryTgtSide,iso:r.iso};
    else
      return{outHex:p.secondaryTgtHex,outSide:p.secondaryTgtSide,iso:r.iso};
  }
}

function applyPairing(intersPoint,intersTgVec,poly,side,gluing,twistedParams,polytopes){
  const pr=pairingFromGluing(gluing,poly,side,twistedParams,intersPoint,polytopes);
  let result=applyPoincarePointAndVector(pr.iso.poincare,intersPoint,intersTgVec);
  let newPoint=result.point,newTvec=result.tgVec;

  if(isRow([poly,pr.outHex],gluing.noncoherentPairs)){
    const toAvoidSide=pr.outSide;
    const index2=(toAvoidSide+1)%6;
    const p1=polytopes[pr.outHex][toAvoidSide];
    const p2=polytopes[pr.outHex][index2];

    const z1p=[p1[0],p1[1]],z2p=[p2[0],p2[1]];
    const z1=poincareToUpperHalf(z1p),z2=poincareToUpperHalf(z2p);
    const x1=z1[0],y1=z1[1],x2=z2[0],y2=z2[1];
    const c_uh=(x1*x1+y1*y1-x2*x2-y2*y2)/(2*(x1-x2));
    const r_uh=Math.sqrt((x1-c_uh)**2+y1*y1);

    // M = [1, -(c-r); 1, -(c+r)]
    const Mreal=[[1,-(c_uh-r_uh)],[1,-(c_uh+r_uh)]];
    // J = [-1,0;0,1]
    const J=[[-1,0],[0,1]];
    // inv(M)*J*M
    const Minv=mat2inv(Mreal);
    const JM=mat2mul(J,Mreal);
    const isoR=mat2mul(Minv,JM);
    const isoRc=isoR.map(r=>r.map(v=>[v,0]));

    // Convert newPoint to upper half
    const np1c=[newPoint[0],newPoint[1]];
    const ntv1c=[newTvec[0],newTvec[1]];
    const np1uh=poincareToUpperHalf(np1c);
    // d(poincare->uh)/dz = 2i/(1-z)^2
    const denom_uh=csub([1,0],np1c);
    const deriv=cdiv([0,2],cmul(denom_uh,denom_uh));
    const ntv1uh=cmul(deriv,ntv1c);

    const orResult=applyUpperHalfPointAndVectorOrientationReversing(isoRc,np1uh,ntv1uh);

    // Convert back to Poincare
    // z_poinc = (z_uh - i)/(z_uh + i)
    const backNp=cdiv(csub(orResult.point,[0,1]),cadd(orResult.point,[0,1]));
    const denomBack=cadd(orResult.point,[0,1]);
    const backNtv=cmul(cdiv([0,2],cmul(denomBack,denomBack)),orResult.tgVec);

    newTvec=[backNtv[0],backNtv[1]];
    // Keep the isometry output point (invariant under orientation reversal)
  }

  return{point:newPoint,tgVec:newTvec,polyIdx:pr.outHex,toAvoid:pr.outSide};
}

// ===== Drawing =====
// Styles: [color, dashed, lineWidth] — indices 0-5 dashed, 6-8 solid (matching MATLAB)
const STYLE_DEFS=[
  {color:'#e44',dashed:true,lw:2.5},   // 0: Red
  {color:'#4a4',dashed:true,lw:2.5},   // 1: Green
  {color:'#44e',dashed:true,lw:2.5},   // 2: Blue
  {color:'#d4d',dashed:true,lw:2.5},   // 3: Magenta
  {color:'#0cc',dashed:true,lw:2.5},   // 4: Cyan
  {color:'#fa0',dashed:true,lw:2.5},   // 5: Orange
  {color:'#806',dashed:false,lw:3.0},  // 6: Purple
  {color:'#333',dashed:false,lw:3.0},  // 7: Dark Grey
  {color:'#964',dashed:false,lw:3.0},  // 8: Brown
];

function drawHexagons(canvases,polytopes,gluing){
  for(let h=0;h<4;h++){
    const canvas=canvases[h];
    const ctx=canvas.getContext('2d');
    const w=canvas.width,ht=canvas.height;
    ctx.clearRect(0,0,w,ht);

    const cx=w/2,cy=ht/2,sc=w/2.3;

    // Draw disk
    ctx.beginPath();
    ctx.arc(cx,cy,sc,0,2*Math.PI);
    ctx.strokeStyle='#555';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // Draw hexagon sides
    for(let s=0;s<6;s++){
      const s2=(s+1)%6;
      const sp=polytopes[h][s],ep=polytopes[h][s2];
      const gc=geodesicCircumferenceFromSegment(sp,ep);
      const sty=STYLE_DEFS[gluing.styleLookup[h][s]];
      drawArc(ctx,cx,cy,sc,sp,ep,gc,sty.color,sty.lw,sty.dashed);
    }

    // Label
    ctx.fillStyle='#888';
    ctx.font='12px sans-serif';
    ctx.fillText('Hex '+(h+1),6,14);
  }
}

function drawArc(ctx,cx,cy,sc,sp,ep,gc,color,lineWidth,dashed){
  const c=gc.center,r=gc.radius;
  let a1=Math.atan2(sp[1]-c[1],sp[0]-c[0]);
  let a2=Math.atan2(ep[1]-c[1],ep[0]-c[0]);
  if(Math.abs(a1-a2)>Math.PI){
    if(a2>a1)a2-=2*Math.PI;else a1-=2*Math.PI;
  }

  ctx.beginPath();
  if(dashed)ctx.setLineDash([6,4]);else ctx.setLineDash([]);
  ctx.strokeStyle=color;
  ctx.lineWidth=lineWidth;

  const nPts=100;
  for(let i=0;i<=nPts;i++){
    const t=a1+(a2-a1)*i/nPts;
    const x=cx+(c[0]+r*Math.cos(t))*sc;
    const y=cy-(c[1]+r*Math.sin(t))*sc;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawGeodesicSegment(ctx,cx,cy,sc,sp,ep,color,lineWidth){
  const gc=geodesicCircumferenceFromSegment(sp,ep);
  drawArc(ctx,cx,cy,sc,sp,ep,gc,color,lineWidth,false);
}

// Draw a fraction of a geodesic arc: from fractStart to fractEnd in [0,1]
function drawGeodesicSegmentPartial(ctx,cx,cy,sc,sp,ep,color,lineWidth,fractStart,fractEnd){
  const gc=geodesicCircumferenceFromSegment(sp,ep);
  const c=gc.center,r=gc.radius;
  let a1=Math.atan2(sp[1]-c[1],sp[0]-c[0]);
  let a2=Math.atan2(ep[1]-c[1],ep[0]-c[0]);
  if(Math.abs(a1-a2)>Math.PI){
    if(a2>a1)a2-=2*Math.PI;else a1-=2*Math.PI;
  }
  const angStart=a1+(a2-a1)*fractStart;
  const angEnd=a1+(a2-a1)*fractEnd;

  ctx.beginPath();
  ctx.setLineDash([]);
  ctx.strokeStyle=color;
  ctx.lineWidth=lineWidth;
  const nPts=Math.max(10,Math.round(100*(fractEnd-fractStart)));
  for(let i=0;i<=nPts;i++){
    const t=angStart+(angEnd-angStart)*i/nPts;
    const x=cx+(c[0]+r*Math.cos(t))*sc;
    const y=cy-(c[1]+r*Math.sin(t))*sc;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

// ===== Audio =====
let audioCtx=null;
let audioPlaying=false;
let audioStopRequested=false;

function createMarimbaNote(freq,duration){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const sr=audioCtx.sampleRate;
  const len=Math.ceil(sr*duration);
  const buffer=audioCtx.createBuffer(1,len,sr);
  const data=buffer.getChannelData(0);
  const attackSamples=Math.round(0.005*sr);

  for(let i=0;i<len;i++){
    const t=i/sr;
    let val=1.0*Math.sin(2*Math.PI*freq*t)*Math.exp(-5*t);
    val+=0.4*Math.sin(2*Math.PI*freq*4.01*t)*Math.exp(-15*t);
    val+=0.15*Math.sin(2*Math.PI*freq*10*t)*Math.exp(-50*t);
    val+=0.1*(Math.random()*2-1)*Math.exp(-100*t);
    if(i<attackSamples)val*=i/attackSamples;
    data[i]=val;
  }
  // Normalize
  let mx=0;
  for(let i=0;i<len;i++)if(Math.abs(data[i])>mx)mx=Math.abs(data[i]);
  if(mx>0)for(let i=0;i<len;i++)data[i]/=mx;
  return buffer;
}

async function playAudio(){
  if(!toMusic||toMusic.length===0)return;
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioPlaying=true;
  audioStopRequested=false;
  document.getElementById('btn-play').disabled=true;
  document.getElementById('btn-stop-audio').disabled=false;

  const frequencies=[440.00,554.37,659.25];
  const speedMul=parseFloat(document.getElementById('audiospeed').value);
  const maxDur=parseFloat(document.getElementById('maxdur').value);

  // Pre-generate note buffers
  const notes=frequencies.map(f=>createMarimbaNote(f,1.5));

  let elapsed=0;
  for(let i=0;i<toMusic.length;i++){
    if(audioStopRequested)break;
    const dt=toMusic[i][0]/speedMul;
    elapsed+=dt;
    if(elapsed>maxDur)break;

    await new Promise(r=>setTimeout(r,dt*1000));
    if(audioStopRequested)break;

    const noteIdx=toMusic[i][1]-1;
    const src=audioCtx.createBufferSource();
    src.buffer=notes[noteIdx];
    src.connect(audioCtx.destination);
    src.start();

    document.getElementById('audio-info').textContent=`Note ${i+1}/${toMusic.length} — ${elapsed.toFixed(1)}s`;
  }

  audioPlaying=false;
  document.getElementById('btn-play').disabled=false;
  document.getElementById('btn-stop-audio').disabled=true;
  document.getElementById('audio-info').textContent='Playback finished.';
}

function stopAudio(){
  audioStopRequested=true;
}

// ===== Main computation =====
let stopRequested=false;
let toMusic=null;
let running=false;

function getParams(){
  const ids=['l1','l2','l3','t1','t2','t3','maxlen','speed'];
  const vals={};
  for(const id of ids)vals[id]=parseFloat(document.getElementById(id).value);
  return vals;
}

async function startComputation(){
  if(running)return;
  running=true;
  stopRequested=false;
  toMusic=null;
  document.getElementById('btn-run').disabled=true;
  document.getElementById('btn-stop').disabled=false;
  document.getElementById('btn-play').disabled=true;
  document.getElementById('progress').style.width='0%';
  document.getElementById('status').textContent='Building surface...';
  document.getElementById('stats').textContent='';

  const p=getParams();
  const lengths=[p.l1,p.l2,p.l3];
  const twists=[p.t1,p.t2,p.t3];
  const maxLen=p.maxlen;
  const drawSpeed=p.speed;

  const gluing=createGluingSeparatingS2();
  const polytopes=buildPolytopes(gluing,lengths);
  const circles=buildCircles(polytopes);

  const canvases=[0,1,2,3].map(i=>document.getElementById('c'+i));
  drawHexagons(canvases,polytopes,gluing);

  // Initial condition: barycenter of hex 0, random angle
  let bx=0,by=0;
  for(let k=0;k<6;k++){bx+=polytopes[0][k][0];by+=polytopes[0][k][1];}
  bx/=6;by/=6;
  const p1=[bx,by];
  const np2=bx*bx+by*by;
  const a=Math.random()*2*Math.PI;
  const tgScale=20*(2/(1-np2))**(-2);
  let curPoint=p1;
  let curTgVec=[tgScale*Math.sin(a),tgScale*Math.cos(a)];
  let polyIdx=0;
  let toAvoid=6; // out of range, no side to avoid initially

  // Warmup phase
  document.getElementById('status').textContent='Warming up (1000 units)...';
  let warmupAccum=0;
  const warmupTarget=1000;
  let stepCount=0;

  while(warmupAccum<warmupTarget){
    if(stopRequested)break;
    const inter=firstIntersection(curPoint,curTgVec,circles[polyIdx],toAvoid);
    if(!inter){document.getElementById('status').textContent='Error: no intersection found';running=false;return;}
    const dtp=distanceTwoPoints(curPoint,inter.point);
    warmupAccum+=dtp;
    const pr=applyPairing(inter.point,inter.tgVec,polyIdx,inter.side,gluing,twists,polytopes);
    curPoint=pr.point;curTgVec=pr.tgVec;polyIdx=pr.polyIdx;toAvoid=pr.toAvoid;
    stepCount++;
    if(stepCount%500===0){
      document.getElementById('progress').style.width=Math.min(100,warmupAccum/warmupTarget*100)+'%';
      await new Promise(r=>setTimeout(r,0));
    }
  }

  if(stopRequested){finish();return;}

  // Main geodesic computation with animated drawing
  document.getElementById('status').textContent='Running geodesic...';
  let travelledDist=0;
  let travelledSinceLast=0;
  let firstCycle=true;
  const toMusicLocal=[];
  const curveCombinations=gluing.curveCombinations;
  stepCount=0;

  // History of recent arcs for greying
  const recentArcs=[]; // [{hexIdx, sp, ep}]
  const GREY_AFTER=2; // grey out arcs after this many newer arcs

  // Save canvas state after drawing hexagons (before any geodesics)
  const baseImages=[];
  for(let h=0;h<4;h++){
    const ctx=canvases[h].getContext('2d');
    baseImages.push(ctx.getImageData(0,0,canvases[h].width,canvases[h].height));
  }

  function drawCurrentArcs(skipLast){
    // Restore base hexagon images
    for(let h=0;h<4;h++){
      canvases[h].getContext('2d').putImageData(baseImages[h],0,0);
    }
    // Draw all recent arcs with proper colours
    const drawCount=skipLast?recentArcs.length-1:recentArcs.length;
    for(let i=0;i<drawCount;i++){
      const arc=recentArcs[i];
      const canvas=canvases[arc.hexIdx];
      const ctx=canvas.getContext('2d');
      const w=canvas.width,ht=canvas.height;
      const cxC=w/2,cyC=ht/2,sc=w/2.3;
      const age=recentArcs.length-1-i;
      if(age>=GREY_AFTER){
        drawGeodesicSegment(ctx,cxC,cyC,sc,arc.sp,arc.ep,'rgba(160,160,160,1.0)',0.8);
      }else{
        drawGeodesicSegment(ctx,cxC,cyC,sc,arc.sp,arc.ep,'rgba(255,80,80,0.85)',1.5);
      }
    }
    // Keep only the most recent arcs (GREY_AFTER + 2 buffer)
    const keep=GREY_AFTER+2;
    if(recentArcs.length>keep){
      // Bake old grey arcs into the base images
      for(let i=0;i<recentArcs.length-keep;i++){
        const arc=recentArcs[i];
        const canvas=canvases[arc.hexIdx];
        const ctx=canvas.getContext('2d');
        const w=canvas.width,ht=canvas.height;
        const cxC=w/2,cyC=ht/2,sc=w/2.3;
        drawGeodesicSegment(ctx,cxC,cyC,sc,arc.sp,arc.ep,'rgba(160,160,160,1.0)',0.8);
      }
      // Update base images with baked arcs
      for(let h=0;h<4;h++){
        const ctx=canvases[h].getContext('2d');
        baseImages[h]=ctx.getImageData(0,0,canvases[h].width,canvases[h].height);
      }
      recentArcs.splice(0,recentArcs.length-keep);
    }
  }

  // Pre-create audio context and marimba note buffers for live playback
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const liveNotes=[440.00,554.37,659.25].map(f=>createMarimbaNote(f,1.5));

  function playNoteNow(curveIdx){
    try{
      const src=audioCtx.createBufferSource();
      src.buffer=liveNotes[curveIdx];
      src.connect(audioCtx.destination);
      src.start();
    }catch(e){}
  }

  const NUM_CHUNKS=7;

  while(travelledDist<maxLen){
    if(stopRequested)break;

    const inter=firstIntersection(curPoint,curTgVec,circles[polyIdx],toAvoid);
    if(!inter)break;

    const dtp=distanceTwoPoints(curPoint,inter.point);
    const arcSp=[...curPoint],arcEp=[...inter.point];
    const arcHex=polyIdx;

    travelledDist+=dtp;
    travelledSinceLast+=dtp;

    // Check curve intersections
    let intersectsCurve=-1;
    for(let c=0;c<3;c++){
      if(isRow([polyIdx,inter.side],curveCombinations[c])){intersectsCurve=c;break;}
    }

    if(intersectsCurve>=0){
      if(!firstCycle){
        toMusicLocal.push([travelledSinceLast,intersectsCurve+1]);
      }
      travelledSinceLast=0;
      firstCycle=false;
    }

    const pr=applyPairing(inter.point,inter.tgVec,polyIdx,inter.side,gluing,twists,polytopes);
    curPoint=pr.point;curTgVec=pr.tgVec;polyIdx=pr.polyIdx;toAvoid=pr.toAvoid;

    stepCount++;

    // Update greying for previous arcs, skip the newest (animated below)
    recentArcs.push({hexIdx:arcHex,sp:arcSp,ep:arcEp});
    drawCurrentArcs(true);

    // Animate the newest arc chunk by chunk on top
    const canvas=canvases[arcHex];
    const ctx=canvas.getContext('2d');
    const w=canvas.width,ht=canvas.height;
    const cxC=w/2,cyC=ht/2,sc=w/2.3;
    const chunkPauseMs=Math.max(2,(dtp/drawSpeed)*143);

    for(let ch=0;ch<NUM_CHUNKS;ch++){
      if(stopRequested)break;
      const f0=ch/NUM_CHUNKS;
      const f1=(ch+1)/NUM_CHUNKS;
      drawGeodesicSegmentPartial(ctx,cxC,cyC,sc,arcSp,arcEp,'rgba(255,80,80,0.85)',1.5,f0,f1);
      await new Promise(r=>setTimeout(r,chunkPauseMs));
    }

    // Play note when hitting a curve
    if(intersectsCurve>=0){
      playNoteNow(intersectsCurve);
    }

    const pct=Math.min(100,travelledDist/maxLen*100);
    document.getElementById('progress').style.width=pct+'%';
    document.getElementById('status').textContent=`Running... ${Math.floor(pct)}% (${toMusicLocal.length} crossings)`;
  }

  toMusic=toMusicLocal;
  document.getElementById('progress').style.width='100%';
  document.getElementById('status').textContent=`Done. ${toMusic.length} intersections recorded.`;
  document.getElementById('stats').innerHTML=`Crossings: ${toMusic.length}<br>Curve 1: ${toMusic.filter(x=>x[1]===1).length}<br>Curve 2: ${toMusic.filter(x=>x[1]===2).length}<br>Curve 3: ${toMusic.filter(x=>x[1]===3).length}`;

  finish();
}

function finish(){
  running=false;
  document.getElementById('btn-run').disabled=false;
  document.getElementById('btn-stop').disabled=true;
  document.getElementById('btn-play').disabled=!(toMusic&&toMusic.length>0);
}

function stopComputation(){
  stopRequested=true;
}

// ===== UI wiring =====
const sliderConfigs={
  l1:{display:'v-l1',fmt:v=>v.toFixed(2)},
  l2:{display:'v-l2',fmt:v=>v.toFixed(2)},
  l3:{display:'v-l3',fmt:v=>v.toFixed(2)},
  t1:{display:'v-t1',fmt:v=>v.toFixed(2)},
  t2:{display:'v-t2',fmt:v=>v.toFixed(2)},
  t3:{display:'v-t3',fmt:v=>v.toFixed(2)},
  maxlen:{display:'v-maxlen',fmt:v=>Math.round(v).toString()},
  speed:{display:'v-speed',fmt:v=>v.toFixed(1)},
  audiospeed:{display:'v-audiospeed',fmt:v=>v.toFixed(1)},
  maxdur:{display:'v-maxdur',fmt:v=>Math.round(v).toString()},
};
for(const[id,cfg] of Object.entries(sliderConfigs)){
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{
    document.getElementById(cfg.display).textContent=cfg.fmt(parseFloat(el.value));
  });
}
</script>
</body>
