<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperMozart — Interactive Evidence</title>
<link rel="stylesheet" href="style.css">
<!-- Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
/* Story-specific styles */
.iso-sub-open .iso-sub-body { display: block !important; }
.iso-sub-open .iso-sub-toggle { transform: rotate(180deg); }
.iso-sub-toggle { display: inline-block; transition: transform 0.2s; }
body { align-items: stretch; }
.story-container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 60px;
  width: 100%;
}
.story-header {
  text-align: center;
  padding: 32px 0 12px;
}
.story-header h1 { font-size: 2rem; margin-bottom: 6px; }
.story-header .subtitle { font-size: 1rem; margin-bottom: 0; }

/* Step sections */
.step {
  margin: 32px 0;
  border: 1px solid #0f3460;
  border-radius: 12px;
  background: #16213e;
  overflow: hidden;
}
.step-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: #0f3460;
  cursor: pointer;
  user-select: none;
}
.step-header:hover { background: #1a4a8a; }
.step-number {
  flex: 0 0 auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #e8d5b7;
  color: #1a1a2e;
  font-weight: 700;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.step-title {
  flex: 1;
  font-size: 1.1rem;
  font-weight: 600;
  color: #e8d5b7;
}
.step-toggle {
  color: #888;
  font-size: 1.2rem;
  transition: transform 0.2s;
}
.step.open .step-toggle { transform: rotate(180deg); }
.step-body {
  display: none;
  padding: 0;
}
.step.open .step-body { display: block; }
.step-content {
  padding: 20px 24px;
  line-height: 1.7;
  font-size: 0.92rem;
}
.step-content h1 { display: none; } /* hide the md title, we have the step header */
.step-content h2 { font-size: 1rem; color: #c9a96e; margin: 18px 0 8px; }
.step-content h3 { font-size: 0.9rem; color: #c9a96e; margin: 14px 0 6px; }
.step-content p { margin: 8px 0; color: #ccc; }
.step-content ul, .step-content ol { margin: 8px 0 8px 20px; color: #ccc; }
.step-content li { margin: 4px 0; }
.step-content strong { color: #e8d5b7; }
.step-content em { color: #a0c0e0; }
.step-content code { background: #0a0a1a; padding: 2px 5px; border-radius: 3px; font-size: 0.85em; }
.step-controls {
  padding: 16px 24px 20px;
  border-top: 1px solid #0f3460;
  background: #0f1a30;
}

/* Lock overlay for steps not yet available */
.step.locked .step-header { opacity: 0.5; cursor: not-allowed; }
.step.locked .step-body { display: none !important; }
.lock-badge {
  font-size: 0.7rem;
  color: #ff9966;
  background: rgba(255,153,102,0.15);
  padding: 2px 8px;
  border-radius: 10px;
}

/* Controls layout helpers */
.controls-row {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: end;
}
.controls-group {
  flex: 1;
  min-width: 200px;
}
.controls-group label { margin: 4px 0 2px; }
.controls-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.controls-actions button { width: auto; padding: 8px 20px; }

/* Hex grid inside step */
.step .hex-grid {
  max-width: 700px;
  margin: 12px auto;
}
.step .hex-grid canvas { border: 1px solid #0f3460; }

/* Progress inside step */
.step .progress-bar { margin: 10px 0 4px; }

/* Orth / arcs panels inline */
.inline-panel { margin-top: 12px; }
.inline-panel .orth-table { max-height: 240px; overflow-y: auto; display: block; }

/* Distribution canvas */
#dist-canvas-story { width: 100%; height: auto; border-radius: 6px; border: 1px solid #0f3460; margin-top: 8px; }

/* CDF SVG */
#cdf-svg-story { width: 100%; height: auto; min-height: 220px; background: #0a0a1a; border-radius: 6px; border: 1px solid #0f3460; margin-top: 8px; }

/* Arc mini canvases */
.arc-mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  max-width: 350px;
}
.arc-mini-grid canvas {
  width: 100%;
  height: auto;
  background: #0a0a1a;
  border-radius: 4px;
  border: 1px solid #0f3460;
}

/* Nav link */
.back-link {
  display: inline-block;
  margin-top: 8px;
  color: #a0a0c0;
  font-size: 0.8rem;
  text-decoration: none;
}
.back-link:hover { color: #e8d5b7; }
</style>
</head>
<body>

<div class="story-container">

<div class="story-header">
  <h1>HyperMozart</h1>
  <p class="subtitle">Interactive Evidence — Geodesics on Genus-2 Hyperbolic Surfaces</p>
  <a href="index.html" class="back-link">← Back to full app</a>
</div>

<div id="story-panels"></div>

<!-- Hidden element required by computation.js -->
<div id="arcs-panel" style="display:none"></div>

</div><!-- /story-container -->


<!-- Load computation modules (same as index.html) -->
<script src="js/geometry.js"></script>
<script src="js/hexagons.js"></script>
<script src="js/geodesic.js"></script>
<script src="js/drawing.js"></script>
<script src="js/audio.js"></script>
<script src="js/computation.js?v=2"></script>
<script src="js/orthospectrum.js?v=3"></script>
<script src="js/arcs.js"></script>
<script src="js/distribution.js"></script>
<script src="js/charts.js"></script>
<script src="js/motifs.js"></script>
<script src="js/story.js"></script>
</body>
</html>
